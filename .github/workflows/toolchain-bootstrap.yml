name: Toolchain bootstrap
on:
  push:
    branches: [feat/moonbit-maze-lab]
    paths: [.github/workflows/toolchain-bootstrap.yml]
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-22.04
    steps:
      - name: Install official MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moon.sh
          bash /tmp/install-moon.sh
          "$HOME/.moon/bin/moon" version --all
          tar -czf /tmp/moonbit-toolchain.tar.gz -C "$HOME" .moon
      - uses: actions/upload-artifact@v4
        with:
          name: moonbit-toolchain-linux
          path: /tmp/moonbit-toolchain.tar.gz
          retention-days: 1
